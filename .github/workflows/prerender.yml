name: Prerender blog metadata

on:
  push:
    branches: [main]
    paths:
      - "writings/**"
      - "scripts/prerender.js"
      - "scripts/prerender-template.html"

permissions:
  contents: write

jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate post pages
        run: node scripts/prerender.js

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blogs/posts
          git diff --staged --quiet || git commit -m "chore: regenerate prerendered blog metadata"
          git push