<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="author" content="Arpon Kapuria">
{{KEYWORDS_TAG}}
<meta name="robots" content="index, follow">

<meta property="og:type" content="article">
<meta property="og:site_name" content="Arpon Kapuria">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{URL}}">
<meta property="og:image" content="{{IMAGE}}">
{{IMAGE_DIMENSIONS}}
<meta property="og:image:alt" content="{{IMAGE_ALT}}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{OG_TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{IMAGE}}">
<meta name="twitter:creator" content="@your_handle">

<meta property="article:published_time" content="{{PUBLISHED}}">
<meta property="article:modified_time" content="{{MODIFIED}}">
<meta property="article:author" content="Arpon Kapuria">
<meta property="article:section" content="{{CATEGORY}}">

<link rel="canonical" href="{{URL}}">

<!-- Instant client-side redirect to the real interactive viewer -->
<script>
  window.location.replace("/blogs/index.html?post={{SLUG}}");
</script>
<meta http-equiv="refresh" content="0; url=/blogs/index.html?post={{SLUG}}">
</head>
<body>
  <noscript>
    <h1>{{OG_TITLE}}</h1>
    <p>{{DESCRIPTION}}</p>
    <p><a href="/blogs/index.html?post={{SLUG}}">Read the full post</a></p>
  </noscript>
</body>
</html>
