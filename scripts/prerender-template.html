<body>

<header class="site-header">
  <a class="brand" href="/blogs.html">blogs</a>
  <span class="sep">|</span>
  <a class="brand-name" href="/index.html">Arpon Kapuria</a>
  <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
    <svg id="icon-sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4"/><g stroke="currentColor" stroke-width="2"><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></g></svg>
    <svg id="icon-moon" viewBox="0 0 24 24" width="18" height="18"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<div class="layout">
  <aside class="toc-wrap">
    <nav id="toc" class="toc" aria-label="Table of contents">
      <p class="toc-title">Table of Contents</p>
      <ol id="toc-list"></ol>
    </nav>
  </aside>

  <main class="article" id="article-root">
    <div id="loading" class="loading">Loading…</div>

    <header class="article-header" id="article-header" hidden>
      <h1 id="article-title"></h1>
      <p class="article-description" id="article-description"></p>
      <div class="article-meta">
        <span id="article-date"></span>
        <span class="dot">•</span>
        <span id="article-readtime"></span>
      </div>
    </header>

    <article id="article-content" class="markdown-body"></article>
  </main>

  <aside class="toc-spacer" aria-hidden="true"></aside>
</div>

<script>
  window.__POST_SLUG__ = "{{SLUG}}";
</script>
<script src="/blogs/blog.js"></script>

<button id="back-to-top" aria-label="Back to top">
  <svg viewBox="0 0 24 24" width="18" height="18">
    <path d="M12 18V6M6 12l6-6 6 6"/>
  </svg>
</button>

<noscript>
  <p>{{OG_TITLE}} — {{DESCRIPTION}}</p>
</noscript>

</body>
</html>
